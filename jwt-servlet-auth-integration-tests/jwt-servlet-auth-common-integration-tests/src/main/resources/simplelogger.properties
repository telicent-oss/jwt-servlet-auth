# slf4j-simple configuration for the Servlet 3.x, Servlet 5.x and JAX-RS 3.x integration tests.
# It lives in this shared test-helpers module so all three pick it up from its jar on their test classpath.
#
# By default slf4j-simple logs everything at INFO and above, which fills the build output with Jetty start/stop
# messages and JWT Servlet Auth's own configuration messages for every test server.

# Only warnings and errors in general...
org.slf4j.simpleLogger.defaultLogLevel=warn

# ...and only errors from JWT Servlet Auth itself. The tests deliberately send unauthenticated, invalid and
# misconfigured requests, each of which is logged as a WARN (e.g. "Request to /hello rejected as unauthenticated with
# HTTP 401"). The tests assert the resulting behaviour, so those expected warnings are just noise here.
org.slf4j.simpleLogger.log.io.telicent.servlet.auth.jwt=error
