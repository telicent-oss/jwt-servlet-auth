# java.util.logging configuration for the embedded Grizzly/Jersey servers used by these integration tests.
# Only warnings and errors are logged, without this every server start/stop logs several INFO lines to the build output.
# Jersey's optional-dependency warnings (WADL, DataSource provider) are avoided at source, by disabling those features in
# ExampleApplicationProperties, rather than being hidden here.
handlers = java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level = ALL
.level = WARNING
